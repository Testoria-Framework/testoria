[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "testoria"
dynamic = ["version"]
description = "API testing for any project: declarative YAML tests, mock server, load and security checks"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Mohamed Amine Ben Salah"}]
dependencies = ["pyyaml>=6.0"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
schema = ["jsonschema>=4.17"]

[project.scripts]
testoria = "testoria.cli:main"

[project.urls]
Homepage = "https://github.com/Testoria-Framework/testoria"

[tool.setuptools]
packages = ["testoria", "testoria.reporters", "testoria.importers"]

[tool.setuptools.dynamic]
version = {attr = "testoria.__version__"}

[tool.pytest.ini_options]
markers = ["functional", "integration", "security", "performance", "smoke"]
