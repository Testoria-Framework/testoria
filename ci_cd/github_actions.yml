name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  cli:
    name: CLI (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          # Oldest supported Python, on runners that still ship it
          - os: ubuntu-22.04
            python: "3.9"
          - os: windows-latest
            python: "3.9"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install with the one-shot installer
        run: ./install.sh --no-path --yes
      - name: Unit tests
        run: |
          py=.venv/bin/python; [ -x "$py" ] || py=.venv/Scripts/python.exe
          "$py" -m pytest tests/unit -q
      - name: Example specs against the demo API and the mock server
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          testoria doctor
          bash scripts/run_tests.sh --language specs --type all
          cd examples/mock-crud && testoria run --mock

  suites:
    name: ${{ matrix.language }} suites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript, java]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: matrix.language == 'javascript'
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Install
        run: |
          flags=""
          [ "${{ matrix.language }}" = javascript ] && flags="--js"
          [ "${{ matrix.language }}" = java ] && flags="--java"
          ./install.sh --no-path --yes $flags
      - name: Run functional, integration and security tests
        run: bash scripts/run_tests.sh --language ${{ matrix.language }} --type all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.language }}
          path: reports/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t testoria .
      - run: docker run --rm testoria --version
