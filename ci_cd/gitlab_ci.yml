stages: [test]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

.base:
  stage: test
  before_script:
    - ./install.sh --no-path --yes $INSTALL_FLAGS
  artifacts:
    when: always
    paths: [reports/]
    reports:
      junit: reports/*junit*.xml

python:
  extends: .base
  image: python:3.12
  script:
    - .venv/bin/python -m pytest tests/unit -q
    - bash scripts/run_tests.sh --language python,specs --type all

javascript:
  extends: .base
  image: nikolaik/python-nodejs:python3.12-nodejs20
  variables: {INSTALL_FLAGS: "--js"}
  script:
    - bash scripts/run_tests.sh --language javascript --type all

java:
  extends: .base
  image: maven:3.9-eclipse-temurin-17
  variables: {INSTALL_FLAGS: "--java --system-deps"}
  script:
    - bash scripts/run_tests.sh --language java --type all
